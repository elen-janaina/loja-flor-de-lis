name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Debug - listar arquivos
        run: |
          echo "Conteúdo da raiz do repositório:"
          ls -la
          echo "---"
          echo "Conteúdo da pasta front-end:"
          ls -la front-end || echo "PASTA front-end NAO ENCONTRADA"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "front-end"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
