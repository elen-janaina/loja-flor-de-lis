version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: loja_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loja_user
      POSTGRES_PASSWORD: loja_pass
      POSTGRES_DB: loja_roupas
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja_user -d loja_roupas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loja_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: loja_user
      DB_PASS: loja_pass
      DB_NAME: loja_roupas
      JWT_SECRET: super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 8h
      FRETE_FIXO: 10.00
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: nginx:alpine
    container_name: loja_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"

volumes:
  pg_data:
